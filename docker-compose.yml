version: '3.8'

services:
  # 1. PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: circuitmind-db
    restart: always
    environment:
      POSTGRES_USER: circuitmind
      POSTGRES_PASSWORD: circuitmind_secure_pass
      POSTGRES_DB: circuitmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuitmind -d circuitmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: circuitmind-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. FastAPI Backend Gateway (Ngspice + KiCad)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: circuitmind-backend
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=circuitmind
      - POSTGRES_PASSWORD=circuitmind_secure_pass
      - POSTGRES_DB=circuitmind_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Celery Task Queue Worker
  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: circuitmind-celery
    command: celery -A app.tasks worker --loglevel=info
    restart: always
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  # 5. Next.js 14 Frontend Studio
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: circuitmind-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/design
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
