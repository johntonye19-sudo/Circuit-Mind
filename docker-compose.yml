version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. PostgreSQL 16 Database with pgvector Extension
  # -------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: circuitmind_db
    restart: always
    environment:
      POSTGRES_USER: circuitmind
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: circuitmind_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Automatically initialize vector extension on fresh volume boot
      - ./docker/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuitmind -d circuitmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 2. Redis Message Broker & Cache
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: circuitmind_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 3. FastAPI Async Gateway & WebSocket Server
  # -------------------------------------------------------------------
  api_gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: circuitmind_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://circuitmind:secret_password@db:5432/circuitmind_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # -------------------------------------------------------------------
  # 4. Celery Task Worker (For SPICE & Heavy CAD Processing)
  # -------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: circuitmind_celery
    restart: always
    command: celery -A app.tasks.worker worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://circuitmind:secret_password@db:5432/circuitmind_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # -------------------------------------------------------------------
  # 5. Next.js 14 Frontend Workspace & 3D Viewport
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: circuitmind_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/design
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api_gateway

volumes:
  pgdata:
